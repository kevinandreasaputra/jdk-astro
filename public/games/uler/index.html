  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap');

    :root {
      --jdk-yellow: #facc15;
      --jdk-black: #0d0d12;
      --jdk-dark-gray: #1a1a24;
      --nokia-silver: #c0c0c8;
      --nokia-btn: #e0e0e8;
      --lcd-bg: #94a581;
      --lcd-pixel: #2c351f;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--jdk-black);
      font-family: 'Space Mono', monospace;
      color: #ffffff;
      overflow-x: hidden;
    }

    .retro-font {
      font-family: 'Press Start 2P', cursive;
    }

    /* Halftone Pattern */

    .bg-halftone {
      background-color: var(--jdk-yellow);
      background-image: radial-gradient(rgba(0, 0, 0, 0.1) 15%, transparent 16%);
      background-size: 8px 8px;
    }

    .jdk-card {
      background: rgba(26, 26, 36, 0.9);
      border: 1px solid var(--jdk-yellow);
      border-radius: 16px;
      transition: all 0.3s ease;
    }

    /* Authentically Styled Nokia LCD Buttons */

    .nokia-lcd-button {
      background-color: transparent;
      border: 3px solid var(--lcd-pixel);
      color: var(--lcd-pixel);
      padding: 10px 20px;
      font-family: 'Press Start 2P', cursive;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.1s steps(2);
      position: relative;
      display: inline-block;
      box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
    }

    .nokia-lcd-button:hover {
      background-color: var(--lcd-pixel);
      color: var(--lcd-bg);
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.2);
    }

    .nokia-lcd-button:active {
      transform: translate(1px, 1px);
      box-shadow: none;
    }

    /* Nokia LCD Text Enhancement */

    .lcd-text {
      color: var(--lcd-pixel);
      letter-spacing: -0.05em;
      text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.05);
    }

    /* NOKIA KEYPAD STYLING */

    .nokia-button {
      background: var(--nokia-btn);
      border-radius: 40% 40% 35% 35%;
      box-shadow:
        inset -2px -2px 4px rgba(0, 0, 0, 0.3),
        inset 2px 2px 2px rgba(255, 255, 255, 0.9),
        0 4px 0 rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #333;
      transition: all 0.05s active;
      cursor: pointer;
      -webkit-user-select: none;
         -moz-user-select: none;
              user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .nokia-button:active {
      transform: translateY(2px);
      box-shadow:
        inset -1px -1px 2px rgba(0, 0, 0, 0.3),
        inset 1px 1px 1px rgba(255, 255, 255, 0.9),
        0 2px 0 rgba(0, 0, 0, 0.4);
    }

    .nokia-button .num {
      font-size: 1.2rem;
      font-weight: 900;
      line-height: 1;
    }

    .nokia-button .letters {
      font-size: 0.5rem;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .nokia-casing {
      background: linear-gradient(135deg, #2a3a4a 0%, #1a2a3a 100%);
      border-radius: 0 0 40px 40px;
      box-shadow: inset 0 2px 10px rgba(255, 255, 255, 0.1);
    }

    /* CRT SCANLINE & SCREEN EFFECTS */

    .game-container {
      position: relative;
      border: 10px solid #1a1a1a;
      border-radius: 30px 30px 0 0;
      overflow: hidden;
      background: #000;
    }

    .game-container::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%,
          rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 10;
    }

    .crt-noise {
      position: absolute;
      inset: 0;
      background: url('https://upload.wikimedia.org/wikipedia/commons/7/76/1k_pnt_noise.png');
      opacity: 0.03;
      pointer-events: none;
      z-index: 12;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--jdk-black);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--jdk-yellow);
      border-radius: 4px;
    }
  </style>
