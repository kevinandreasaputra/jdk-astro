<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#F0F0F0"/>
  
  <!-- Border -->
  <rect x="4" y="4" width="392" height="292" fill="none" stroke="#121212" stroke-width="4" rx="8"/>
  
  <!-- Box Icon -->
  <g transform="translate(160, 90)">
    <!-- Box Body -->
    <rect x="0" y="20" width="80" height="60" fill="#FFE900" stroke="#121212" stroke-width="3"/>
    <!-- Box Flaps -->
    <polygon points="0,20 40,0 80,20 40,40" fill="#FFA500" stroke="#121212" stroke-width="3"/>
    <!-- Box Lines -->
    <line x1="40" y1="40" x2="40" y2="80" stroke="#121212" stroke-width="2"/>
  </g>
  
  <!-- Question Mark -->
  <text x="200" y="135" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#121212" text-anchor="middle">?</text>
  
  <!-- Text -->
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#666666" text-anchor="middle">NO IMAGE</text>
  <text x="200" y="235" font-family="Arial, sans-serif" font-size="12" fill="#999999" text-anchor="middle">Product image not available</text>
</svg>
